[project]
name = "wp-reposter"
version = "0.1.0"
description = "WordPress REST API репостер"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "maxapi>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (автоматически обновляет синтаксис)
    "B",   # flake8-bugbear (частые ошибки)
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (ruff format сам разобьется)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
