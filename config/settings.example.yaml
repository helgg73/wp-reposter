# config/settings.example.yaml
# Шаблон конфигурации WP Reposter.
# Скопируйте этот файл в config/settings.yaml и заполните реальными значениями.
# Файл config/settings.yaml НЕ должен попадать в git (см. .gitignore).

check_interval: 300
max_new_posts_per_run: 5
max_posts_per_fetch: 100
min_interval_between_messages: 0.5

sources:
  - name: "Мой источник"
    base_url: "https://make.wordpress.org/playground"
    api_path: "/wp-json/wp/v2"
    featured_image_size: "medium"
    # ^ DEPRECATED. Не используется с ADR 0031.
    max_pages: 3
    per_page: 10
    # Путь к файлу-заглушке (относительно корня проекта).
    # Используется, если у поста нет картинки.
    # false = без заглушки.
    # Предустановленная: "static/defaults/blank-1200x675.png"
    # Пользовательские файлы — в static/ (не версионируются).
    default_image: false
    fields:
      - name: title.rendered
        type: plain
      - name: excerpt.rendered
        type: html
      - name: link
        type: plain

channels:
  # Имя канала: только [a-z0-9_], начинается с буквы.
  # Используется в путях файловой системы и в именах
  # переменных окружения (VK_ACCESS_TOKEN_<NAME>).
  - type: max
    name: max_main
    enabled: true
    chat_id: "-1001234567890"
    disable_link_preview: true

  # Пример VK-канала (ADR 0022).
  # Токен: VK_ACCESS_TOKEN_<NAME> в .env.
  # group_id: ID сообщества, положительное число.
  # - type: vk
  #   name: vk_main
  #   enabled: true
  #   group_id: 123456789

reposters:
  - name: "og_to_max"
    source: "Мой источник"
    filter:
      include_category_ids: []
      exclude_category_ids: []
      include_tag_ids: []
      exclude_tag_ids: []
    channels:
      - channel: max_main
        template:
          - prefix: "📢 "
            field: title.rendered
            max_length: 55
            postfix: "\n\n"
          - prefix: ""
            field: excerpt.rendered
            # max_length в символах. 0 — без ограничений.
            max_length: 300
            postfix: "\n\n"
            # truncate_mode управляет алгоритмом обрезки (ADR 0029).
            # Допустимые значения: words (по умолчанию) и first_paragraph.
            # Отсутствие truncate_mode равнозначно words.
            #
            # words — накапливает абзацы и слова, пока влезает в max_length.
            # first_paragraph — берёт только первый абзац. Если он длиннее
            # max_length — обрезает по слову. max_length = 0 — без лимита,
            # но всё равно только первый абзац.
            #
            # first_paragraph сработает, если после обработки html-поля
            # (transform_html) в нём есть \n\n. Для html-поля с абзацами
            # (<p>...</p>) transform_html превращает границы в \n\n.
            # Если поле приходит одной строкой без абзацев — режим вернёт
            # весь текст.
            truncate_mode: first_paragraph   # только лид
          - prefix: "🔗 "
            field: link
            max_length: 0
            postfix: ""
