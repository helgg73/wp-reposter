# config/settings.example.yaml
# Шаблон конфигурации WP Reposter.
# Скопируйте этот файл в config/settings.yaml и заполните реальными значениями.
# Файл config/settings.yaml НЕ должен попадать в git (см. .gitignore).

check_interval: 300
max_new_posts_per_run: 5

sources:
  - name: "Мой источник"
    base_url: "https://make.wordpress.org/playground"
    api_path: "/wp-json/wp/v2"
    featured_image_size: "medium"
    max_pages: 3
    per_page: 10
    include_category_ids: []
    exclude_category_ids: []
    include_tag_ids: []
    exclude_tag_ids: []
    # Поля, которые источник отдаёт в ответе API.
    # name — путь через точку для вложенных полей.
    # type — тип для выбора обработчика (см. content_transform).
    fields:
      - name: title.rendered
        type: plain
      - name: excerpt.rendered
        type: html
      - name: link
        type: plain

export:
  # Обязательная секция. Без неё сервис не стартует:
  # постить некуда.
  max_channel:
    enabled: true
    disable_link_preview: true
    # Обязательный шаблон поста: список блоков.
    template:
      - prefix: ""
        field: title.rendered
        max_length: 55
        postfix: "\n\n"
      - prefix: ""
        field: excerpt.rendered
        max_length: 0
        postfix: "\n\n"
      - prefix: ""
        field: link
        max_length: 0
        postfix: ""
