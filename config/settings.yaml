check_interval: 300
max_new_posts_per_run: 5

sources:
  - name: "Областная газета"
    base_url: "https://oblgazeta.ru"  # <-- ВАЖНО: именно base_url
    api_path: "/wp-json/wp/v2"
    featured_image_size: "medium"
    max_pages: 3
    per_page: 20
    include_category_ids: []
    exclude_category_ids: []
    include_tag_ids: [3223]
    exclude_tag_ids: []

export:
  max_channel:
    enabled: true
    disable_link_preview: true
    template: "📢 {title}\n\n{content}🔗 {link}"
